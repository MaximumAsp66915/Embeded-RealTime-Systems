; config.ini
; Smart Surveillance System — Step 2: Image Processing
; Edit these values for your setup. This file is read by person_detector.py.

[general]
; Your student ID — burned into the frame overlay
student_id = 402101906

[camera]
; source_type = http_poll fetches a fresh JPEG over plain HTTP on every
; frame (see scripts/laptop_camera_server.py + scripts/laptop_stream_webcam.sh
; on the laptop side). This replaced raw UDP capture AND HTTP-MJPEG-video
; capture — both kept freezing on the first frame with OpenCV's FFmpeg
; backend when fed from a live network source. Plain "fetch the latest
; bytes" polling has no video codec/protocol state to freeze in.
source_type = http_poll
http_url = http://192.168.0.50:8080/latest.jpg

[detector]
; "hog"            -> OpenCV's built-in HOG+SVM person detector (default).
;                     No model download needed, lightweight, CPU-only —
;                     a good fit for the Orange Pi's ARM CPU.
; "mobilenet_ssd"   -> Heavier but more accurate. Requires the prototxt +
;                     caffemodel files below to exist.
backend = hog

; Only used when backend = mobilenet_ssd
mobilenet_prototxt = models/MobileNetSSD_deploy.prototxt
mobilenet_model = models/MobileNetSSD_deploy.caffemodel
mobilenet_confidence = 0.5

[output]
; Where the annotated frame + person-count JSON are written so the C code
; (web server / REST API) can read them. /dev/shm is a RAM-backed tmpfs,
; so this is fast and avoids wearing the SD card.
shared_dir = /dev/shm/surveillance
frame_filename = frame.jpg
persons_filename = persons.json
jpeg_quality = 80

[display]
; Set to false when running headless on the board (no monitor attached).
; The annotated frame is still written to shared_dir either way.
show_window = false

[thermal]
; Step 6: adaptive thermal management. This detector never decides WHEN
; to throttle — that decision lives entirely in the C daemon
; (6.Advanced Features/code/src/thermal.c), which writes control_path
; whenever it changes its mind. This section just says where to look for
; that signal, and how often to check it.
control_path = /dev/shm/surveillance/control.json
check_interval_s = 2.0
